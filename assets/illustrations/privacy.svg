<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Everything stays on your machine</title>
  <desc id="d">The browser, the engine, the model and the .hivedesk folder all live on your machine. The network is used only to download the runtime and the model on the first run, and for Lend mode when you pair with a friend.</desc>
  <style>
  .flap { transform-box: fill-box; transform-origin: 50% 100%; animation: flap .16s ease-in-out infinite alternate; }
  .f2 { animation-delay: .08s; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.45); } }
  .trail { stroke-dasharray: 2 7; animation: dash 1.6s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -18; } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  .blink { animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
  .bob { animation: bob 4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 6s ease-in-out infinite; }
  @keyframes grow { 0% { transform: scaleX(.12); } 70%,100% { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171411"/><stop offset="1" stop-color="#100E0C"/></linearGradient>
    <radialGradient id="warm" cx="420" cy="210" r="660" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFB531" stop-opacity=".12"/><stop offset=".5" stop-color="#FFB531" stop-opacity=".035"/><stop offset="1" stop-color="#FFB531" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/></pattern>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#221E1A"/><stop offset="1" stop-color="#1A1714"/></linearGradient>
    <linearGradient id="winStroke" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4D4338"/><stop offset="1" stop-color="#2C2620"/></linearGradient>
    <linearGradient id="honey" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD072"/><stop offset="1" stop-color="#F09A1E"/></linearGradient>
    <linearGradient id="honeyV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD072"/><stop offset="1" stop-color="#D9821A"/></linearGradient>
    <linearGradient id="beeBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD36E"/><stop offset="1" stop-color="#E08A18"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#FFB531" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#8C8172" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="18" fill="url(#warm)"/>
  <rect x=".5" y=".5" width="1199" height="419" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
<rect x="40" y="56" width="800" height="324" rx="22" fill="#141210" fill-opacity=".6" stroke="#FFB531" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="64" y="42" width="152" height="28" rx="14" fill="#1B1714" stroke="#FFB531" stroke-opacity=".55"/><g transform="translate(76 47) scale(0.75)" fill="none" stroke="#FFB531" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.2"/><path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/><path d="M12 14.6v2"/></g><text x="100" y="61" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="650" fill="#FFD072" text-anchor="start">your machine</text><rect x="72" y="110" width="230" height="134" rx="14" fill="url(#win)" stroke="#3A332B" filter="url(#shadow)"/><path d="M119.6,150.8 Q119.6,153.0 117.7,154.1 L105.9,160.9 Q104.0,162.0 102.1,160.9 L90.3,154.1 Q88.4,153.0 88.4,150.8 L88.4,137.2 Q88.4,135.0 90.3,133.9 L102.1,127.1 Q104.0,126.0 105.9,127.1 L117.7,133.9 Q119.6,135.0 119.6,137.2 Z" fill="#2A251F" stroke="#FFB531" stroke-opacity=".6"/><g transform="translate(94 134) scale(0.8333333333333334)" fill="none" stroke="#FFB531" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.6 12 5.6 21.5 12 21.5 12 18 18.4 12 18.4 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></g><text x="134" y="150" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15.5" font-weight="650" fill="#F2E9DA" text-anchor="start">Your browser</text><text x="94" y="188" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="12.5" font-weight="500" fill="#B5A994" text-anchor="start">127.0.0.1 only</text><text x="94" y="210" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="12.5" font-weight="500" fill="#B5A994" text-anchor="start">secret token per run</text><rect x="326" y="110" width="230" height="134" rx="14" fill="url(#win)" stroke="#3A332B" filter="url(#shadow)"/><path d="M373.6,150.8 Q373.6,153.0 371.7,154.1 L359.9,160.9 Q358.0,162.0 356.1,160.9 L344.3,154.1 Q342.4,153.0 342.4,150.8 L342.4,137.2 Q342.4,135.0 344.3,133.9 L356.1,127.1 Q358.0,126.0 359.9,127.1 L371.7,133.9 Q373.6,135.0 373.6,137.2 Z" fill="#2A251F" stroke="#FFB531" stroke-opacity=".6"/><g transform="translate(348 134) scale(0.8333333333333334)" fill="none" stroke="#FFB531" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.6l8.1 4.7v9.4L12 21.4l-8.1-4.7V7.3z"/><path d="M6.6 10h10.8M6.6 14h10.8"/></g><text x="388" y="150" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15.5" font-weight="650" fill="#F2E9DA" text-anchor="start">The engine</text><text x="348" y="188" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="12.5" font-weight="500" fill="#B5A994" text-anchor="start">node, few dependencies</text><text x="348" y="210" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="12.5" font-weight="500" fill="#B5A994" text-anchor="start">approval before risky steps</text><rect x="580" y="110" width="230" height="134" rx="14" fill="url(#win)" stroke="#3A332B" filter="url(#shadow)"/><path d="M627.6,150.8 Q627.6,153.0 625.7,154.1 L613.9,160.9 Q612.0,162.0 610.1,160.9 L598.3,154.1 Q596.4,153.0 596.4,150.8 L596.4,137.2 Q596.4,135.0 598.3,133.9 L610.1,127.1 Q612.0,126.0 613.9,127.1 L625.7,133.9 Q627.6,135.0 627.6,137.2 Z" fill="#2A251F" stroke="#FFB531" stroke-opacity=".6"/><g transform="translate(602 134) scale(0.8333333333333334)" fill="none" stroke="#FFB531" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.6l8.1 4.7v9.4L12 21.4l-8.1-4.7V7.3z"/><path d="M12 7.4l1.3 3.3 3.3 1.3-3.3 1.3-1.3 3.3-1.3-3.3L7.4 12l3.3-1.3z"/></g><text x="642" y="150" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15.5" font-weight="650" fill="#F2E9DA" text-anchor="start">The model</text><text x="602" y="188" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="12.5" font-weight="500" fill="#B5A994" text-anchor="start">runs on your GPU or CPU</text><text x="602" y="210" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="12.5" font-weight="500" fill="#B5A994" text-anchor="start">~/.hivedesk/models</text><g fill="none" stroke="#FFB531" stroke-opacity=".55" stroke-width="1.6"><path class="trail" d="M302 177 H 326"/><path class="trail" d="M556 177 H 580"/></g><rect x="72" y="270" width="738" height="82" rx="14" fill="#1A1714" stroke="#3A332B"/><g transform="translate(92 288) scale(0.9166666666666666)" fill="none" stroke="#FFB531" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.3l2 2.2h8.7A1.5 1.5 0 0 1 21 8.7v9.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></g><text x="126" y="305" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="650" fill="#F2E9DA" text-anchor="start">.hivedesk/ in your folder</text><text x="126" y="330" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="12.5" font-weight="500" fill="#B5A994" text-anchor="start">events.jsonl   state.json   playbooks/   workspace/</text><g fill="none" stroke="#8C8172" stroke-width="1.4" stroke-dasharray="4 6"><path d="M840 140 H 900"/><path d="M840 300 H 900"/></g><rect x="900" y="88" width="260" height="104" rx="14" fill="#1A1714" stroke="#3A332B"/><g transform="translate(920 108) scale(0.9166666666666666)" fill="none" stroke="#8C8172" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11M7.5 10l4.5 4.5 4.5-4.5M4 20h16"/></g><text x="954" y="125" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="650" fill="#D9CDB9" text-anchor="start">First run only</text><text x="920" y="154" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="500" fill="#8C8172" text-anchor="start">downloads the runtime and</text><text x="920" y="174" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="500" fill="#8C8172" text-anchor="start">the model, then works offline</text><rect x="900" y="248" width="260" height="104" rx="14" fill="#1A1714" stroke="#3A332B"/><g transform="translate(920 268) scale(0.9166666666666666)" fill="none" stroke="#8C8172" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.5" width="9" height="6.5" rx="1.4"/><rect x="12.5" y="14" width="9" height="6.5" rx="1.4"/><path d="M5 13.5v1.3a2.2 2.2 0 0 0 2.2 2.2H10M19 10.5V9.2A2.2 2.2 0 0 0 16.8 7H14"/></g><text x="954" y="285" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="650" fill="#D9CDB9" text-anchor="start">Lend mode, if you pair</text><text x="920" y="314" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="500" fill="#8C8172" text-anchor="start">only model prompts go to the</text><text x="920" y="334" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="500" fill="#8C8172" text-anchor="start">friend you paired with</text>
</svg>
