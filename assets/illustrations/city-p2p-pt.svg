<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 -10 940 640" width="940" height="640" role="img" aria-labelledby="t"><title id="t">O seu PC e o PC de um amigo com GPU, ligados peer to peer, são prédios de uma City onde os agentes trabalham.</title><style>.ha-svg { width: 100%; height: auto; overflow: visible; }
.ha-tether { fill: none; stroke: #FFF5E6; stroke-opacity: .16; stroke-width: 1.5; stroke-dasharray: 3 6; }
.ha-link { fill: none; stroke: #FFB531; stroke-opacity: .25; stroke-width: 3; }
.ha-link-flow { fill: none; stroke: #FFD27A; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 22; animation: haflow 1.6s linear infinite; }
@keyframes haflow { to { stroke-dashoffset: -48; } }
.ha-pkt { fill: #FFD27A; offset-path: path("M362 128 C 480 30, 720 30, 838 128"); offset-rotate: 0deg; animation: hapkt 2.8s var(--hd-ease) infinite; }
.ha-pkt.p2 { fill: #9BD9AE; animation-direction: reverse; animation-delay: 1.4s; }
@keyframes hapkt { 0% { offset-distance: 0%; opacity: 0; } 10%, 90% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
.ha-deck { fill: none; stroke: #2F2820; stroke-width: 12; stroke-linecap: round; }
.ha-rail { fill: none; stroke: #FFF5E6; stroke-opacity: .18; stroke-width: 1.5; }
.ha-deck-lit { fill: none; stroke: #FFB531; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 160; stroke-dashoffset: 160; animation: halit 4.2s var(--hd-ease) infinite; }
@keyframes halit { 0% { stroke-dashoffset: 160; opacity: 1; } 45% { stroke-dashoffset: 0; opacity: 1; } 80% { stroke-dashoffset: 0; opacity: .2; } 100% { stroke-dashoffset: 0; opacity: 0; } }
.ha-bee { offset-path: path("M530 384 Q 607 348 685 374"); offset-rotate: auto; animation: habee 4.2s linear infinite; }
.ha-bee.b2 { animation-delay: 1.4s; }
.ha-bee.b3 { animation-delay: 2.8s; offset-path: path("M685 374 Q 607 348 530 384"); }
@keyframes habee { 0% { offset-distance: 0%; opacity: 0; } 8%, 92% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
.ha-fan { animation: hafan 1.2s linear infinite; }
@keyframes hafan { to { transform: rotate(360deg); } }
.ha-gpu-glow { animation: haglow 2.4s ease-in-out infinite alternate; }
@keyframes haglow { from { opacity: .35; } to { opacity: 1; } }
.ha-vram rect { fill: #9BD9AE; opacity: .85; }
.ha-vram .v4 { animation: hav 2.4s ease-in-out infinite alternate; }
.ha-vram .v5 { opacity: .2; animation: hav 2.4s ease-in-out infinite alternate-reverse; }
@keyframes hav { from { opacity: .2; } to { opacity: .9; } }
.ha-win path { opacity: .85; }
.ha-win .w2 { animation: hawin 5s steps(1) infinite; }
.ha-win .w3 { animation: hawin 7s steps(1) infinite 2s; }
@keyframes hawin { 0%, 60% { opacity: .85; } 61%, 100% { opacity: .15; } }
.ha-city-glow { animation: haglow 4s ease-in-out infinite alternate; }
.ha-code { stroke-dasharray: 120; stroke-dashoffset: 120; animation: hacode 3.2s var(--hd-ease) infinite; }
@keyframes hacode { 0% { stroke-dashoffset: 120; } 40%, 100% { stroke-dashoffset: 0; } }
.ha-labels { position: absolute; inset: 0; pointer-events: none; }
.ha-l { position: absolute; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--hd-line-2); border-radius: 999px; background: color-mix(in srgb, var(--hd-bg) 82%, transparent); color: var(--hd-text); font-size: clamp(11px, 1.2vw, 13px); font-weight: 550; white-space: nowrap; transform: translateX(-50%); }
.ha-l .i { width: 14px; height: 14px; color: var(--hd-honey-2); }
.ha-l.l-a { left: 13.3%; top: 39%; }
.ha-l.l-p { left: 50%; top: -1%; }
.ha-l.l-b { right: 0; top: 47%; transform: none; }
.ha-l.l-c { left: 50%; top: 99%; }
.ha-l { padding: 2px 8px; }
.ha-l .i { display: none; }
.ha-l.l-b { top: 49%; }
.ha-l.l-a { left: 2%; transform: none; }
.ha-bee, .ha-pkt { display: none; }
.ha-deck-lit { stroke-dashoffset: 0; opacity: .6; }
.ha-l, .hd-chip, .city-tabs, .tabs-boxed, .tabs-boxed .tab { border-radius: 6px; }
.ha-l { background: color-mix(in srgb, var(--hd-bg) 90%, transparent); border-color: var(--hd-line-2); font-weight: 500; }
.ha-l .i { color: var(--hd-dim); }
.ha-link { stroke: #E3A447; stroke-opacity: .18; stroke-width: 1.5; }
.ha-link-flow { stroke: #E3A447; stroke-width: 1.5; stroke-dasharray: 1.5 18; }
.ha-pkt { fill: #E3A447; }
.ha-pkt.p2 { fill: #A9BCD0; }
.ha-tether { stroke: #FFFFFF; stroke-opacity: .12; stroke-width: 1; }
.ha-deck { stroke: #23262B; stroke-width: 10; }
.ha-rail { stroke-opacity: .12; stroke-width: 1; }
.ha-deck-lit { stroke: #E3A447; stroke-width: 2; }
.ha-vram rect { fill: #7FC8A0; opacity: .8; }
.ha-link-flow { animation-duration: 3s; }
.ha-bee { animation-duration: 6s; }
.ha-fan { animation-duration: 2.4s; }
.ha-gpu-glow, .ha-city-glow, .ha-vram .v4, .ha-vram .v5 { animation-duration: 4s; }
.ha-win .w2, .ha-win .w3 { animation: none; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .ha-bee, .ha-pkt { display: none; } }
.lbl rect { fill: #0F1013; stroke: #FFFFFF; stroke-opacity: .14; } .lbl text { fill: #E6E7EA; font: 500 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }</style><rect x="130" y="-10" width="940" height="640" fill="#0B0C0E"/>
      
