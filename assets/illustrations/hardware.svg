CDB9" text-anchor="start">Works, but slow: a few tokens</text><text x="190" y="264" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13.5" font-weight="500" fill="#D9CDB9" text-anchor="start">per second. Small tasks.</text><path d="M208.7,309.8 Q208.7,311.0 207.6,311.6 L201.0,315.4 Q200.0,316.0 199.0,315.4 L192.4,311.6 Q191.3,311.0 191.3,309.8 L191.3,302.2 Q191.3,301.0 192.4,300.4 L199.0,296.6 Q200.0,296.0 201.0,296.6 L207.6,300.4 Q208.7,301.0 208.7,302.2 Z" fill="#FFB531" stroke="#FFB531" stroke-width="1.4"/><path d="M234.7,309.8 Q234.7,311.0 233.6,311.6 L227.0,315.4 Q226.0,316.0 225.0,315.4 L218.4,311.6 Q217.3,311.0 217.3,309.8 L217.3,302.2 Q217.3,301.0 218.4,300.4 L225.0,296.6 Q226.0,296.0 227.0,296.6 L233.6,300.4 Q234.7,301.0 234.7,302.2 Z" fill="none" stroke="#3A332B" stroke-width="1.4"/><path d="M260.7,309.8 Q260.7,311.0 259.6,311.6 L253.0,315.4 Q252.0,316.0 251.0,315.4 L244.4,311.6 Q243.3,311.0 243.3,309.8 L243.3,302.2 Q243.3,301.0 244.4,300.4 L251.0,296.6 Q252.0,296.0 253.0,296.6 L259.6,300.4 Q260.7,301.0 260.7,302.2 Z" fill="none" stroke="#3A332B" stroke-width="1.4"/><text x="280" y="311" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="500" fill="#8C8172" text-anchor="start">small jobs</text><rect x="420" y="44" width="360" height="312" rx="16" fill="url(#win)" stroke="#FFB531" stroke-opacity="0.6" filter="url(#shadow)"/><g transform="translate(444 70) scale(1.0833333333333333)" fill="none" stroke="#FFB531" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="11" rx="2"/><circle cx="9.2" cy="11.5" r="3"/><path d="M15 10h3.5M15 13h3.5M5.5 17v2.6M8.5 17v2.6M11.5 17v2.6"/></g><text x="482" y="90" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" fill="#F2E9DA" text-anchor="start">GPU with 6 to 8 GB</text><clipPath id="jar1"><rect x="450" y="136" width="92" height="150" rx="20"/></clipPath>