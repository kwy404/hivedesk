oboto,sans-serif" font-size="14.5" font-weight="650" fill="#FFD072" text-anchor="start">a bigger model you choose</text><text x="950" y="220" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="650" fill="#8C8172" text-anchor="start" letter-spacing="1.4">WHAT TO EXPECT</text><text x="950" y="244" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13.5" font-weight="500" fill="#D9CDB9" text-anchor="start">Bigger jobs, faster turns.</text><text x="950" y="264" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13.5" font-weight="500" fill="#D9CDB9" text-anchor="start">Ollama, LM Studio or a key.</text><path d="M968.7,309.8 Q968.7,311.0 967.6,311.6 L961.0,315.4 Q960.0,316.0 959.0,315.4 L952.4,311.6 Q951.3,311.0 951.3,309.8 L951.3,302.2 Q951.3,301.0 952.4,300.4 L959.0,296.6 Q960.0,296.0 961.0,296.6 L967.6,300.4 Q968.7,301.0 968.7,302.2 Z" fill="#FFB531" stroke="#FFB531" stroke-width="1.4"/><path d="M994.7,309.8 Q994.7,311.0 993.6,311.6 L987.0,315.4 Q986.0,316.0 985.0,315.4 L978.4,311.6 Q977.3,311.0 977.3,309.8 L977.3,302.2 Q977.3,301.0 978.4,300.4 L985.0,296.6 Q986.0,296.0 987.0,296.6 L993.6,300.4 Q994.7,301.0 994.7,302.2 Z" fill="#FFB531" stroke="#FFB531" stroke-width="1.4"/><path d="M1020.7,309.8 Q1020.7,311.0 1019.6,311.6 L1013.0,315.4 Q1012.0,316.0 1011.0,315.4 L1004.4,311.6 Q1003.3,311.0 1003.3,309.8 L1003.3,302.2 Q1003.3,301.0 1004.4,300.4 L1011.0,296.6 Q1012.0,296.0 1013.0,296.6 L1019.6,300.4 Q1020.7,301.0 1020.7,302.2 Z" fill="#FFB531" stroke="#FFB531" stroke-width="1.4"/><text x="1040" y="311" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="500" fill="#8C8172" text-anchor="start">bigger jobs</text>
