<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">What your hardware can do</title>
  <desc id="d">Three tiers: no GPU runs a small model slowly, a GPU with 6 to 8 GB runs the 7B model for small and medium tasks, a bigger GPU or an API key handles bigger jobs.</desc>
  <style>
  .flap { transform-box: fill-box; transform-origin: 50% 100%; animation: flap .16s ease-in-out infinite alternate; }
  .f2 { animation-delay: .08s; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.45); } }
  .trail { stroke-dasharray: 2 7; animation: dash 1.6s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -18; } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  .blink { animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
  .bob { animation: bob 4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 6s ease-in-out infinite; }
  @keyframes grow { 0% { transform: scaleX(.12); } 70%,100% { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171411"/><stop offset="1" stop-color="#100E0C"/></linearGradient>
    <radialGradient id="warm" cx="600" cy="120" r="660" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFB531" stop-opacity=".12"/><stop offset=".5" stop-color="#FFB531" stop-opacity=".035"/><stop offset="1" stop-color="#FFB531" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/></pattern>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#221E1A"/><stop offset="1" stop-color="#1A1714"/></linearGradient>
    <linearGradient id="winStroke" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4D4338"/><stop offset="1" stop-color="#2C2620"/></linearGradient>
    <linearGradient id="honey" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD072"/><stop offset="1" stop-color="#F09A1E"/></linearGradient>
    <linearGradient id="honeyV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD072"/><stop offset="1" stop-color="#D9821A"/></linearGradient>
    <linearGradient id="beeBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD36E"/><stop offset="1" stop-color="#E08A18"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#FFB531" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#8C8172" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="400" rx="18" fill="url(#warm)"/>
  <rect x=".5" y=".5" width="1199" height="399" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
