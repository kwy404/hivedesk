<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">First run of hivedesk</title>
  <desc id="d">One command detects the hardware, installs the local runtime, downloads a Qwen2.5-Coder model with a progress bar and opens the Hive.</desc>
  <style>
  .flap { transform-box: fill-box; transform-origin: 50% 100%; animation: flap .16s ease-in-out infinite alternate; }
  .f2 { animation-delay: .08s; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.45); } }
  .trail { stroke-dasharray: 2 7; animation: dash 1.6s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -18; } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  .blink { animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
  .bob { animation: bob 4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 6s ease-in-out infinite; }
  @keyframes grow { 0% { transform: scaleX(.12); } 70%,100% { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171411"/><stop offset="1" stop-color="#100E0C"/></linearGradient>
    <radialGradient id="warm" cx="900" cy="220" r="660" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFB531" stop-opacity=".12"/><stop offset=".5" stop-color="#FFB531" stop-opacity=".035"/><stop offset="1" stop-color="#FFB531" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/></pattern>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#221E1A"/><stop offset="1" stop-color="#1A1714"/></linearGradient>
    <linearGradient id="winStroke" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4D4338"/><stop offset="1" stop-color="#2C2620"/></linearGradient>
    <linearGradient id="honey" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD072"/><stop offset="1" stop-color="#F09A1E"/></linearGradient>
    <linearGradient id="honeyV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD072"/><stop offset="1" stop-color="#D9821A"/></linearGradient>
    <linearGradient id="beeBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD36E"/><stop offset="1" stop-color="#E08A18"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#FFB531" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#8C8172" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="440" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="440" rx="18" fill="url(#warm)"/>
  <rect x=".5" y=".5" width="1199" height="439" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>

  <g>
    <rect x="40" y="48" width="660" height="344" rx="14" fill="url(#win)" filter="url(#shadow)"/>
    <path d="M54 48h632a14 14 0 0 1 14 14v24h-660v-24a14 14 0 0 1 14-14z" fill="#2A251F"/>
    <rect x="40" y="86" width="660" height="1" fill="#3A332B"/>
    <text x="58" y="72" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="650" fill="#A89C8B" text-anchor="start" letter-spacing="1.4">TERMINAL</text>
    <circle class="pulse" cx="678" cy="68" r="3.6" fill="#FFB531"/>
    <text x="64" y="124" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="14" font-weight="600" fill="#FFB531" text-anchor="start">$</text><text x="84" y="124" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="14" font-weight="600" fill="#F2E9DA" text-anchor="start">npx hivedesk</text><text x="64" y="154" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="13" font-weight="500" fill="#8C8172" text-anchor="start">hive</text><text x="164" y="154" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="13" font-weight="500" fill="#D9CDB9" text-anchor="start">http://127.0.0.1:51734/?t=****  (browser opened)</text><text x="64" y="184" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="13" font-weight="500" fill="#8C8172" text-anchor="start">models</text><text x="164" y="184" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="13" font-weight="500" fill="#D9CDB9" text-anchor="start">no Ollama or LM Studio running, using the local runtime</text><text x="64" y="214" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="13" font-weight="500" fill="#8C8172" text-anchor="start">hardware</text><text x="164" y="214" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="13" font-weight="500" fill="#D9CDB9" text-anchor="start">GeForce GTX 1060 6 GB, 16 GB RAM, 212 GB free</text><text x="64" y="244" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="13" font-weight="500" fill="#8C8172" text-anchor="start">runtime</text><text x="164" y="244" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="13" font-weight="500" fill="#D9CDB9" text-anchor="start">node-llama-cpp installed in ~/.hivedesk/runtime (CUDA)</text><text x="64" y="274" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="13" font-weight="500" fill="#8C8172" text-anchor="start">model</text><text x="164" y="274" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="13" font-weight="500" fill="#D9CDB9" text-anchor="start">Qwen2.5-Coder 3B Instruct Q4_K_M, 2.1 GB, all on GPU</text><text x="64" y="304" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="13" font-weight="500" fill="#8C8172" text-anchor="start">source</text><text x="164" y="304" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="13" font-weight="500" fill="#D9CDB9" text-anchor="start">huggingface.co/Qwen, checked with SHA-256</text><text x="64" y="334" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="13" font-weight="500" fill="#8C8172" text-anchor="start">download</text><rect x="164" y="323" width="330" height="12" rx="6" fill="#2A251F" stroke="#3A332B"/><rect class="grow" x="164" y="323" width="205" height="12" rx="6" fill="url(#honey)"/><text x="508" y="334" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="13" font-weight="500" fill="#FFD072" text-anchor="start">62%  1.3 of 2.1 GB</text><text x="64" y="364" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="13" font-weight="500" fill="#8C8172" text-anchor="start">next</text><text x="164" y="364" font-family="ui-monospace,SFMono-Regular,Cascadia Mono,Consolas,monospace" font-size="13" font-weight="500" fill="#D9CDB9" text-anchor="start">load the model, then the crew is ready</text><rect class="blink" x="64" y="380" width="9" height="16" fill="#FFB531"/>
    <rect x="40.75" y="48.75" width="658.5" height="342.5" rx="13.4" fill="none" stroke="url(#winStroke)" stroke-opacity="1" stroke-width="1.5"/>
  </g><line x1="812" y1="88" x2="812" y2="334" stroke="#3A332B" stroke-width="2"/><line x1="812" y1="88" x2="812" y2="252" stroke="#FFB531" stroke-width="2"/><path d="M832.8,97.1 Q832.8,100.0 830.3,101.4 L814.5,110.6 Q812.0,112.0 809.5,110.6 L793.7,101.4 Q791.2,100.0 791.2,97.1 L791.2,78.9 Q791.2,76.0 793.7,74.6 L809.5,65.4 Q812.0,64.0 814.5,65.4 L830.3,74.6 Q832.8,76.0 832.8,78.9 Z" fill="url(#honey)" stroke="#FFB531" stroke-width="1.5"/><g transform="translate(802 78) scale(0.8333333333333334)" fill="none" stroke="#1B1714" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="852" y="85" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="650" fill="#F2E9DA" text-anchor="start">Detect the hardware</text><text x="852" y="107" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13.5" font-weight="500" fill="#8C8172" text-anchor="start">GPU, VRAM, RAM and disk</text><path d="M832.8,179.1 Q832.8,182.0 830.3,183.4 L814.5,192.6 Q812.0,194.0 809.5,192.6 L793.7,183.4 Q791.2,182.0 791.2,179.1 L791.2,160.9 Q791.2,158.0 793.7,156.6 L809.5,147.4 Q812.0,146.0 814.5,147.4 L830.3,156.6 Q832.8,158.0 832.8,160.9 Z" fill="url(#honey)" stroke="#FFB531" stroke-width="1.5"/><g transform="translate(802 160) scale(0.8333333333333334)" fill="none" stroke="#1B1714" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="852" y="167" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="650" fill="#F2E9DA" text-anchor="start">Install the runtime</text><text x="852" y="189" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13.5" font-weight="500" fill="#8C8172" text-anchor="start">once, in ~/.hivedesk</text><circle cx="812" cy="252" r="30" fill="#FFB531" opacity=".22" filter="url(#glow)"/><path d="M832.8,261.1 Q832.8,264.0 830.3,265.4 L814.5,274.6 Q812.0,276.0 809.5,274.6 L793.7,265.4 Q791.2,264.0 791.2,261.1 L791.2,242.9 Q791.2,240.0 793.7,238.6 L809.5,229.4 Q812.0,228.0 814.5,229.4 L830.3,238.6 Q832.8,240.0 832.8,242.9 Z" fill="#221E1A" stroke="#FFB531" stroke-width="1.5"/><g transform="translate(801 241) scale(0.9166666666666666)" fill="none" stroke="#FFB531" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.6l8.1 4.7v9.4L12 21.4l-8.1-4.7V7.3z"/><path d="M12 7.4l1.3 3.3 3.3 1.3-3.3 1.3-1.3 3.3-1.3-3.3L7.4 12l3.3-1.3z"/></g><text x="852" y="249" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="650" fill="#F2E9DA" text-anchor="start">Download the model</text><text x="852" y="271" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13.5" font-weight="500" fill="#8C8172" text-anchor="start">0.5 to 9.0 GB, resumes if cut</text><path d="M832.8,343.1 Q832.8,346.0 830.3,347.4 L814.5,356.6 Q812.0,358.0 809.5,356.6 L793.7,347.4 Q791.2,346.0 791.2,343.1 L791.2,324.9 Q791.2,322.0 793.7,320.6 L809.5,311.4 Q812.0,310.0 814.5,311.4 L830.3,320.6 Q832.8,322.0 832.8,324.9 Z" fill="#221E1A" stroke="#3A332B" stroke-width="1.5"/><g transform="translate(801 323) scale(0.9166666666666666)" fill="none" stroke="#8C8172" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.6l8.1 4.7v9.4L12 21.4l-8.1-4.7V7.3z"/><path d="M6.6 10h10.8M6.6 14h10.8"/></g><text x="852" y="331" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="650" fill="#8C8172" text-anchor="start">Open the Hive</text><text x="852" y="353" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13.5" font-weight="500" fill="#8C8172" text-anchor="start">the crew says ready</text>
</svg>
