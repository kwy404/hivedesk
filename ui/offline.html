<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start hivedesk</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0A0B0D; color: #E6E8EB; font: 15px/1.6 "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 520px; text-align: center; }
  h1 { font-size: 20px; font-weight: 600; margin: 16px 0 8px; }
  code { display: inline-block; margin: 12px 0; padding: 8px 16px; border-radius: 6px; background: #131519; border: 1px solid rgb(228 232 238 / .11); color: #F6C46F; font: 14px "JetBrains Mono", "Cascadia Mono", ui-monospace, monospace; }
  p { color: #B4BAC3; }
  button { margin-top: 8px; height: 32px; padding: 0 16px; border-radius: 6px; border: 0; background: #F2A93B; color: #17110A; font: 600 13px inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/favicon.svg" alt="" width="64" height="64">
  <h1>hivedesk is not running</h1>
  <p>The app window talks to the hivedesk server on this computer. Start it in a terminal, then try again:</p>
  <code>npx hivedesk</code>
  <p>Everything stays on your machine.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
