<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0E0D0B">
  <meta name="referrer" content="no-referrer">
  <title>hivedesk mini</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/widget.css">
  <script src="/vendor/voodoo-1.0.0.full.min.js" data-manual data-no-observer data-xray-shortcut="false"></script>
  <script type="module" src="/widget.js"></script>
</head>
<body>
  <main class="wg" aria-label="hivedesk mini widget">
    <header class="wg-top">
      <span class="wg-brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.2 28 9.1v13.8L16 29.8 4 22.9V9.1z" fill="#FFB531" stroke="#24160C" stroke-width="1.4"/><rect x="5" y="12.2" width="22" height="3" fill="#24160C"/><rect x="5" y="18.6" width="22" height="3" fill="#24160C"/></svg>hivedesk</span>
      <span class="wg-demo" hidden title="No model is running. The crew follows a script.">Demo</span>
      <span class="wg-conn" role="status" aria-live="polite"></span>
      <button type="button" class="wg-ib wg-open" title="Open the full Hive" aria-label="Open the full Hive"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
    </header>
    <div class="wg-stage"><canvas class="wg-canvas" aria-hidden="true"></canvas></div>
    <section class="wg-job" aria-label="Current job">
      <div class="wg-req">Connecting...</div>
      <div class="wg-bar" role="progressbar" aria-label="Job progress" aria-valuemin="0" aria-valuemax="100"><i></i></div>
      <div class="wg-sub"></div>
    </section>
    <section class="wg-queue" aria-label="Queue for the model"></section>
    <section class="wg-chat" aria-label="Latest chat line" aria-live="polite"></section>
    <section class="wg-appr" aria-label="Approval" hidden></section>
    <footer class="wg-actions">
      <button type="button" class="wg-btn wg-approve" disabled>Approve</button>
      <button type="button" class="wg-btn wg-pause">Pause crew</button>
    </footer>
  </main>
</body>
</html>
