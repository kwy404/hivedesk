name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]
        include:
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # node-pty is removed after install: its Windows console helper crashes on headless runners, and the
      # terminal tests fall back to the labeled basic terminal (the real PTY is tested on real machines).
      - run: npm ci
      - name: Remove the optional node-pty
        shell: bash
        run: rm -rf node_modules/node-pty
      - name: Lint
        run: node scripts/lint.mjs
      - name: Rules check
        run: node scripts/check-rules.mjs
      - name: Tests
        run: npx vitest run
      - name: Site check
        run: node scripts/check-site.mjs
      - name: Doctor runs
        run: node src/cli.js --doctor || true
